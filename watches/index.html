<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A searchable collection of inscriptions on watches connected to famous people and historic events.">
  <title>Watch inscriptions — Nitya's Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @font-face { font-family: 'Spectral'; src: url('/fonts/Spectral-ExtraLight.ttf'); font-weight: 200; }
    @font-face { font-family: 'Spectral'; src: url('/fonts/Spectral-Light.ttf'); font-weight: 300; }
    @font-face { font-family: 'Spectral'; src: url('/fonts/Spectral-Regular.ttf'); font-weight: 400; }
    @font-face { font-family: 'Spectral'; src: url('/fonts/Spectral-Medium.ttf'); font-weight: 500; }

    :root {
      --ink: #24211d;
      --muted: #8a837a;
      --paper: #f9f8f5;
      --panel: #fff;
      --line: #e8e4de;
      --accent: #c85d2e;
      --watch-list-width: 31rem;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { background: var(--paper); color: var(--ink); font-family: 'Spectral', Georgia, serif; overflow-x: hidden; }
    button, input { font: inherit; }

    .eyebrow {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .search-input {
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      color: var(--ink);
      font-size: 17px;
      outline: 0;
      padding: 9px 0;
      width: 100%;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: #aaa39b; }

    .archive-search {
      backdrop-filter: blur(10px);
      background: rgba(249,248,245,.94);
      border-bottom: 1px solid var(--line);
      margin-bottom: 34px;
      padding: 2px 0 14px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .featured-carousel {
      background: #fff;
      border-bottom: 1px solid var(--line);
      overflow: hidden;
      padding: 34px 0 38px;
      position: relative;
    }
    .featured-track {
      align-items: flex-end;
      display: flex;
      gap: clamp(28px, 3.5vw, 64px);
      overflow-x: auto;
      overscroll-behavior-x: contain;
      padding: 0 clamp(58px, 10vw, 180px) 4px;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .featured-track::-webkit-scrollbar { display: none; }
    .featured-card {
      flex: 0 0 clamp(270px, 30vw, 490px);
      scroll-snap-align: center;
      text-align: center;
    }
    .featured-stage {
      align-items: center;
      background: linear-gradient(145deg, #faf9f6, #eeeae3);
      border-radius: 15px;
      box-shadow: 0 7px 22px rgba(45, 38, 31, .08);
      display: flex;
      height: clamp(320px, 34vw, 500px);
      justify-content: center;
      overflow: hidden;
      padding: clamp(18px, 2.5vw, 34px);
    }
    .featured-image {
      filter: drop-shadow(0 12px 10px rgba(30, 24, 19, .2));
      height: 100%;
      object-fit: contain;
      width: 100%;
    }
    .featured-person {
      font-size: clamp(20px, 2vw, 29px);
      font-weight: 300;
      line-height: 1.1;
      margin-top: 15px;
    }
    .featured-model {
      color: #4f5960;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(11px, 1.05vw, 15px);
      line-height: 1.35;
      margin-top: 7px;
    }
    .featured-arrow {
      align-items: center;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(70,64,57,.12);
      border-radius: 50%;
      box-shadow: 0 4px 14px rgba(28,24,20,.13);
      color: var(--ink);
      cursor: pointer;
      display: flex;
      font-family: Georgia, serif;
      font-size: 31px;
      height: 52px;
      justify-content: center;
      line-height: 1;
      position: absolute;
      top: 43%;
      transform: translateY(-50%);
      width: 52px;
      z-index: 5;
    }
    .featured-arrow:hover { background: var(--paper); }
    .featured-arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .featured-arrow.previous { left: 14px; }
    .featured-arrow.next { right: 14px; }

    .collection-grid {
      display: grid;
      gap: 56px 34px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }

    .watch-card {
      min-width: 0;
      perspective: 900px;
      position: relative;
      text-align: center;
    }

    .watch-toggle {
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      display: block;
      font: inherit;
      outline: none;
      padding: 0;
      text-align: inherit;
      width: 100%;
    }

    .watch-flip {
      height: 315px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .58s cubic-bezier(.2,.7,.2,1);
    }
    .watch-card.flipped .watch-flip { transform: rotateY(180deg); }
    .watch-toggle:focus-visible .watch-flip { outline: 1px solid var(--accent); outline-offset: 4px; }

    .watch-face {
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      height: 100%;
      position: absolute;
      width: 100%;
    }

    .watch-stage {
      align-items: center;
      background: var(--paper);
      display: flex;
      height: 315px;
      isolation: isolate;
      justify-content: center;
      overflow: hidden;
      padding: 7px 5px 0;
      inset: 0;
    }

    .watch-photo {
      filter: drop-shadow(0 7px 5px rgba(30, 24, 19, .17));
      height: 298px;
      object-fit: contain;
      transition: transform .35s ease, filter .35s ease;
      width: 100%;
    }
    .watch-card:not(.flipped):hover .watch-photo { filter: drop-shadow(0 9px 7px rgba(30,24,19,.24)); transform: translateY(-3px) rotate(-1deg); }

    .visual-note {
      background: rgba(249,248,245,.9);
      bottom: 7px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 7px;
      left: 8px;
      letter-spacing: .08em;
      padding: 2px 4px;
      position: absolute;
      text-transform: uppercase;
    }

    .watch-quote {
      align-items: center;
      background: transparent;
      border: 0;
      box-shadow: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      inset: 0;
      justify-content: center;
      overflow: hidden;
      padding: 16px 12px 46px;
      transform: rotateY(180deg);
    }
    .quote-text {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.16;
      margin: auto 0;
      max-height: 174px;
      overflow: hidden;
      text-wrap: balance;
      white-space: pre-line;
    }
    .watch-quote.quote-medium .quote-text { font-size: 12px; line-height: 1.12; }
    .watch-quote.quote-long .quote-text { font-size: 10px; line-height: 1.08; }

    .watch-back {
      align-items: center;
      background:
        radial-gradient(circle at 37% 30%, rgba(255,255,255,.9), transparent 15%),
        repeating-radial-gradient(circle at center, transparent 0 19px, rgba(70,70,68,.12) 20px 21px),
        linear-gradient(145deg, #f3f2ef, #aaa9a4 49%, #e8e7e2 72%, #96958f);
      border: 1px solid #8c8b86;
      border-radius: 50%;
      box-shadow: 0 8px 12px rgba(39,35,30,.18), inset 0 0 0 4px rgba(255,255,255,.28);
      color: #34332f;
      display: flex;
      flex-direction: column;
      height: 88px;
      justify-content: center;
      padding: 14px;
      position: relative;
      transition: transform .35s ease;
      width: 88px;
    }
    .watch-back::before,
    .watch-back::after {
      background: linear-gradient(90deg, #3f352d, #776557 40%, #352d27);
      content: '';
      height: 52px;
      left: 26px;
      position: absolute;
      width: 36px;
      z-index: -1;
    }
    .watch-back::before { border-radius: 6px 6px 0 0; top: -42px; }
    .watch-back::after { border-radius: 0 0 6px 6px; bottom: -42px; }
    .watch-card:hover .watch-back,
    .watch-card:focus-visible .watch-back { transform: translateY(-3px) rotateY(10deg); }
    .watch-back-mark {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 7px;
      line-height: 1.18;
      max-height: 34px;
      overflow: hidden;
      text-transform: uppercase;
    }

    .card-caption { padding-top: 13px; text-align: center; }
    .card-person { font-size: 18px; font-weight: 300; line-height: 1.12; }
    .card-model { color: #4f5960; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; line-height: 1.25; margin-top: 5px; }
    .back-meta {
      align-items: center;
      display: none;
      flex-direction: column;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      gap: 3px;
      left: 0;
      position: absolute;
      right: 0;
      top: 269px;
      z-index: 4;
    }
    .watch-card.flipped .back-meta { display: flex; }
    .back-reference {
      color: var(--muted);
      font-size: 8px;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .back-source { color: #a75d3c; font-size: 8px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
    .back-source:hover { color: #6f3922; }

    .record-row {
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      padding: 16px 8px 16px 0;
      position: relative;
    }
    .record-row:hover { color: var(--accent); }
    .record-row.selected::before { color: var(--accent); content: '›'; font-size: 21px; left: -20px; position: absolute; top: 14px; }

    .detail-photo {
      background: var(--paper);
      max-height: 410px;
      object-fit: contain;
      width: 100%;
    }
    .inscription {
      border-left: 1px solid var(--accent);
      font-size: clamp(21px, 2.4vw, 32px);
      font-weight: 300;
      letter-spacing: -.015em;
      line-height: 1.18;
      margin: 22px 0;
      padding-left: 20px;
      white-space: pre-line;
    }
    .grade {
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      display: inline-flex;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      gap: 5px;
      letter-spacing: .08em;
      padding: 4px 8px;
      text-transform: uppercase;
    }
    .grade-dot { background: #668c6b; border-radius: 50%; height: 5px; width: 5px; }
    .grade-b .grade-dot { background: #b68b47; }
    .grade-c .grade-dot { background: #a87b70; }

    .split-resizer { display: none; }
    @media (min-width: 1280px) {
      .watch-list { flex: 0 0 var(--watch-list-width); width: var(--watch-list-width); }
      .detail-panel { max-height: 100vh; overflow-y: auto; position: sticky; top: 0; }
      .split-resizer { align-items: stretch; cursor: col-resize; display: flex; flex: 0 0 12px; justify-content: center; margin: 0 -6px; touch-action: none; z-index: 10; }
      .split-resizer::before { background: var(--line); content: ''; width: 1px; }
      .split-resizer:hover::before, .split-resizer:focus-visible::before { background: var(--accent); width: 2px; }
    }

    @media (max-width: 767px) {
      .featured-carousel { padding: 22px 0 28px; }
      .featured-track { gap: 20px; padding-left: 34px; padding-right: 34px; }
      .featured-card { flex-basis: min(78vw, 330px); }
      .featured-stage { height: 300px; }
      .featured-arrow { height: 40px; width: 40px; }
      .featured-arrow.previous { left: 7px; }
      .featured-arrow.next { right: 7px; }
      .collection-grid { gap: 32px 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .watch-flip, .watch-stage { height: 215px; }
      .watch-photo { height: 202px; }
      .quote-text { max-height: 138px; }
      .back-meta { top: 169px; }
      .card-person { font-size: 15px; }
      .card-model { font-size: 10px; }
    }
  </style>
</head>
<body class="min-h-screen">
  <header class="px-5 sm:px-8 py-6 border-b border-stone-200 flex flex-col sm:flex-row justify-between items-start sm:items-baseline gap-4">
    <a href="/home" class="text-2xl sm:text-4xl font-light tracking-tight text-stone-900 no-underline whitespace-nowrap">Nitya's Notes</a>
    <nav class="flex gap-3 sm:gap-6 text-xs sm:text-sm tracking-wide">
      <a href="/watches" class="text-stone-900">WATCHES</a>
    </nav>
  </header>

  <div id="main-area" class="min-w-0"></div>

  <script src="/Watches.js?v=watch-inscriptions-5"></script>
  <script>
    const categoryLabels = { Collection: 'All', Culture: 'Culture', Power: 'Presidents & power', Sport: 'Sport & racing', Exploration: 'Exploration & space' };
    const editorialIllustrations = {
      Culture: '/images/watches/illustration-culture.png',
      Power: '/images/watches/illustration-power.png',
      Sport: '/images/watches/illustration-sport.png',
      Exploration: '/images/watches/illustration-exploration.png'
    };
    const featuredWatchIds = [73, 1, 19, 5, 21, 32];
    let selectedWatchId = null;
    let flippedWatchId = null;
    let searchQuery = '';
    let listWidth = Number.parseFloat(localStorage.getItem('watchListWidth')) || 496;
    let resizeState = null;

    const toSlug = value => value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const inscriptionLines = value => value.replace(/ \/ /g, '\n').replace(/ · /g, '\n');
    const cutoutImage = value => `${value.replace('/images/watches/', '/images/watches/cutouts/').replace(/\.(?:jpe?g|png)$/i, '.webp')}?v=watch-cutouts-4`;
    const modelReference = value => {
      const match = value.match(/\bref\.\s*[^\s,;]+/i);
      return match ? match[0].replace(/^ref\./i, 'Ref.') : '';
    };
    const gradeText = { A: 'Direct source', B: 'Strong secondary source', C: 'Caution noted' };

    function matchesSearch(watch) {
      if (!searchQuery.trim()) return true;
      const haystack = [watch.person, watch.giver, watch.brand, watch.model, watch.inscription, watch.context].filter(Boolean).join(' ').toLowerCase();
      return searchQuery.toLowerCase().split(/\s+/).every(word => haystack.includes(word));
    }

    function currentWatches() {
      return watches.filter(matchesSearch);
    }

    function renderSearch() {
      return `<div class="archive-search flex items-end gap-5"><label class="flex-1 min-w-0"><input class="search-input" type="search" value="${searchQuery.replace(/"/g, '&quot;')}" oninput="handleSearch(event)" placeholder="Search a person, watchmaker, model, or inscription…" aria-label="Search across all watch inscriptions"></label><span class="eyebrow whitespace-nowrap hidden sm:inline">${currentWatches().length} records</span></div>`;
    }

    function renderFeaturedWatches() {
      const featured = featuredWatchIds.map(id => watches.find(watch => watch.id === id)).filter(Boolean);
      return `<section class="featured-carousel" aria-label="Featured watch engravings">
        <button class="featured-arrow previous" type="button" onclick="scrollFeatured(-1)" aria-label="Previous featured watches">‹</button>
        <div class="featured-track" id="featured-track">
          ${featured.map((watch, index) => `<article class="featured-card">
            <div class="featured-stage"><img class="featured-image" src="${cutoutImage(watch.image || editorialIllustrations[watch.category])}" alt="${watch.brand} ${watch.model} connected to ${watch.person}" ${index < 2 ? 'fetchpriority="high"' : 'loading="lazy"'}></div>
            <h2 class="featured-person">${watch.person}</h2>
            <p class="featured-model">${watch.brand}</p>
          </article>`).join('')}
        </div>
        <button class="featured-arrow next" type="button" onclick="scrollFeatured(1)" aria-label="Next featured watches">›</button>
      </section>`;
    }

    function watchVisual(watch) {
      if (watch.image) return `<img class="watch-photo" src="${cutoutImage(watch.image)}" alt="${watch.brand} ${watch.model} connected to ${watch.person}" loading="lazy">`;
      return `<img class="watch-photo" src="${cutoutImage(editorialIllustrations[watch.category])}" alt="Editorial reconstruction for ${watch.person}; original photograph unavailable" loading="lazy"><span class="visual-note">Editorial reconstruction</span>`;
    }

    function quoteSize(watch) {
      if (watch.inscription.length > 180) return 'quote-long';
      if (watch.inscription.length > 90) return 'quote-medium';
      return '';
    }

    function renderCollection() {
      const filtered = currentWatches();
      document.getElementById('main-area').innerHTML = `
        ${renderFeaturedWatches()}
        <main class="px-5 sm:px-8 py-8 max-w-[1480px]">
          <div class="max-w-2xl mb-7">
            <h1 class="text-3xl sm:text-5xl font-light leading-[1.05] mb-3">Search over Watch Engravings</h1>
            <p class="text-stone-500 leading-relaxed">An assortment of personalized watch engravings</p>
          </div>
          ${renderSearch()}
          <div class="collection-grid">
            ${filtered.map(watch => `
              <article class="watch-card ${flippedWatchId === watch.id ? 'flipped' : ''}" data-watch-id="${watch.id}">
                <button class="watch-toggle" onclick="toggleWatch(${watch.id}, this)" aria-pressed="${flippedWatchId === watch.id}" aria-label="${flippedWatchId === watch.id ? `Show the watch for ${watch.person}` : `Show the inscription on ${watch.person}’s watch`}">
                  <div class="watch-flip">
                    <div class="watch-face watch-stage" aria-hidden="true">${watchVisual(watch)}</div>
                    <div class="watch-face watch-quote ${quoteSize(watch)}" aria-hidden="true"><blockquote class="quote-text">${inscriptionLines(watch.inscription)}</blockquote></div>
                  </div>
                </button>
                <div class="back-meta">${modelReference(watch.model) ? `<span class="back-reference">${modelReference(watch.model)}</span>` : ''}<a class="back-source" href="${watch.source}" target="_blank" rel="noreferrer">Source ↗</a></div>
                <div class="card-caption"><div class="card-person">${watch.person}</div><div class="card-model">${watch.brand}</div></div>
              </article>`).join('')}
          </div>
          ${filtered.length ? '' : '<p class="text-stone-400 italic">No inscriptions found.</p>'}
        </main>`;
    }

    function setListWidth(width, persist = true) {
      const area = document.getElementById('main-area');
      const available = area?.getBoundingClientRect().width || innerWidth;
      listWidth = Math.min(Math.max(width, 260), Math.max(260, available - 380));
      document.documentElement.style.setProperty('--watch-list-width', `${listWidth}px`);
      if (persist) localStorage.setItem('watchListWidth', Math.round(listWidth));
    }

    function renderList() {
      const filtered = currentWatches();
      setListWidth(listWidth, false);
      document.getElementById('main-area').innerHTML = `
        <div class="flex flex-col xl:flex-row min-w-0">
          <main class="watch-list min-w-0 w-full px-5 sm:px-8 py-8 border-b xl:border-b-0 border-stone-200 ${selectedWatchId ? 'hidden xl:block' : ''}">
            ${renderSearch()}
            <div>
              ${filtered.map(watch => `<article class="record-row ${selectedWatchId === watch.id ? 'selected' : ''}" onclick="selectWatch(${watch.id})"><div class="flex justify-between gap-4"><div class="min-w-0"><h2 class="text-lg leading-tight">${watch.person}</h2><p class="text-stone-500 text-sm mt-1">${watch.brand} · ${watch.model}</p></div><span class="eyebrow shrink-0">${watch.grade}</span></div></article>`).join('')}
              ${filtered.length ? '' : '<p class="text-stone-400 italic">No inscriptions found.</p>'}
            </div>
          </main>
          <div class="split-resizer" role="separator" aria-label="Resize the list" aria-orientation="vertical" tabindex="0" onpointerdown="startResize(event)" onkeydown="resizeWithKeys(event)"></div>
          <aside class="detail-panel flex-1 min-w-0 bg-white px-5 sm:px-8 py-8 xl:min-h-screen ${selectedWatchId ? '' : 'hidden xl:block'}">
            ${selectedWatchId ? renderDetail() : '<p class="text-stone-400 italic">Choose a watch to read its inscription.</p>'}
          </aside>
        </div>`;
    }

    function renderDetail() {
      const watch = watches.find(w => w.id === selectedWatchId);
      if (!watch) return '';
      return `
        <article class="max-w-3xl">
          <button onclick="closeDetail()" class="float-right text-stone-400 hover:text-stone-800 text-xl" aria-label="Close">✕</button>
          <p class="eyebrow mb-2">${categoryLabels[watch.category]}</p>
          <h1 class="text-3xl sm:text-4xl font-light leading-tight pr-10">${watch.person}</h1>
          ${watch.giver ? `<p class="text-stone-400 mt-1">from ${watch.giver}</p>` : ''}
          <p class="text-stone-500 mt-2 mb-7">${watch.brand} · ${watch.model}</p>
          <figure class="mb-7"><img class="detail-photo" src="${cutoutImage(watch.image || editorialIllustrations[watch.category])}" alt="${watch.image ? `${watch.brand} ${watch.model} connected to ${watch.person}` : `Editorial reconstruction for ${watch.person}; original photograph unavailable`}"><figcaption class="eyebrow mt-2">${watch.image ? 'Photograph via linked source' : 'Editorial reconstruction — original photograph unavailable'}</figcaption></figure>
          <p class="eyebrow">On the back</p>
          <blockquote class="inscription">${inscriptionLines(watch.inscription)}</blockquote>
          <p class="text-stone-600 leading-relaxed text-lg max-w-2xl">${watch.context}</p>
          <div class="flex flex-wrap items-center gap-4 mt-8">
            <span class="grade grade-${watch.grade.toLowerCase()}" title="Evidence grade ${watch.grade}"><span class="grade-dot"></span>${gradeText[watch.grade]}</span>
            <a class="text-orange-700 hover:text-orange-900 text-sm" href="${watch.source}" target="_blank" rel="noreferrer">See photographs and provenance →</a>
          </div>
        </article>`;
    }

    function render() {
      renderCollection();
    }

    function scrollFeatured(direction) {
      const track = document.getElementById('featured-track');
      if (!track) return;
      track.scrollBy({ left: direction * Math.min(track.clientWidth * .78, 560), behavior: 'smooth' });
    }

    function handleSearch(event) { searchQuery = event.target.value; selectedWatchId = null; flippedWatchId = null; render(); requestAnimationFrame(() => { const input = document.querySelector('.search-input'); if (input) { input.focus(); input.setSelectionRange(searchQuery.length, searchQuery.length); } }); }
    function toggleWatch(id, button) {
      const watch = watches.find(item => item.id === id);
      const card = button.closest('.watch-card');
      const wasFlipped = card.classList.contains('flipped');
      document.querySelectorAll('.watch-card.flipped').forEach(card => {
        if (card === button.closest('.watch-card')) return;
        const previous = watches.find(item => item.id === Number(card.dataset.watchId));
        card.classList.remove('flipped');
        const previousButton = card.querySelector('.watch-toggle');
        previousButton.setAttribute('aria-pressed', 'false');
        previousButton.setAttribute('aria-label', `Show the inscription on ${previous.person}’s watch`);
      });
      card.classList.toggle('flipped', !wasFlipped);
      button.setAttribute('aria-pressed', String(!wasFlipped));
      button.setAttribute('aria-label', wasFlipped ? `Show the inscription on ${watch.person}’s watch` : `Show the watch for ${watch.person}`);
      flippedWatchId = wasFlipped ? null : id;
    }
    function selectWatch(id) { selectedWatchId = id; const watch = watches.find(w => w.id === id); history.replaceState(null, '', `${location.pathname}#${toSlug(watch.person + '-' + watch.brand + '-' + watch.id)}`); renderList(); if (innerWidth < 1280) scrollTo(0, 0); }
    function openWatch(id) { const watch = watches.find(w => w.id === id); selectedWatchId = id; searchQuery = ''; history.replaceState(null, '', `${location.pathname}#${toSlug(watch.person + '-' + watch.brand + '-' + watch.id)}`); render(); scrollTo(0, 0); }
    function closeDetail() { selectedWatchId = null; history.replaceState(null, '', location.pathname); render(); }

    function startResize(event) { if (innerWidth < 1280) return; event.preventDefault(); resizeState = { startX: event.clientX, startWidth: document.querySelector('.watch-list').getBoundingClientRect().width }; event.currentTarget.setPointerCapture(event.pointerId); addEventListener('pointermove', resizeList); addEventListener('pointerup', stopResize, { once: true }); }
    function resizeList(event) { if (resizeState) setListWidth(resizeState.startWidth + event.clientX - resizeState.startX); }
    function stopResize() { resizeState = null; removeEventListener('pointermove', resizeList); }
    function resizeWithKeys(event) { if (!['ArrowLeft','ArrowRight'].includes(event.key)) return; event.preventDefault(); setListWidth(listWidth + (event.key === 'ArrowRight' ? 24 : -24)); }

    function applyHash() {
      if (location.hash) history.replaceState(null, '', location.pathname);
    }

    addEventListener('resize', () => setListWidth(listWidth, false));
    applyHash();
    render();
  </script>
</body>
</html>
